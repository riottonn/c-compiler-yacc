<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Візуалізація AST</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: #f8fafc; font-family: monospace; overflow: hidden; }
        .node circle { fill: #38bdf8; stroke: #0284c7; stroke-width: 2px; }
        .node text { font-size: 13px; fill: #f1f5f9; font-weight: bold; }
        .link { fill: none; stroke: #64748b; stroke-width: 1.5px; }
        #canvas { width: 100vw; height: 100vh; }
        #info { position: absolute; top: 15px; left: 15px; background: rgba(15,23,42,0.85); padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Графічна візуалізація AST</h3>
        <p>Масштабування: колесо миші | Переміщення: drag-and-drop</p>
    </div>
    <svg id="canvas"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#canvas").attr("width", width).attr("height", height);
        const g = svg.append("g").attr("transform", "translate(80, 200)");

        svg.call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));
        const tree = d3.tree().nodeSize([45, 180]);

        d3.json("ast.json").then(data => {
            const root = d3.hierarchy(data);
            tree(root);

            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            node.append("circle").attr("r", 6);
            node.append("text")
                .attr("dy", 4)
                .attr("x", d => d.children ? -10 : 10)
                .style("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.name);
        });
    </script>
</body>
</html>
